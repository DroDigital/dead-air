<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD AIR</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        color: #f0e0c0;
        font-family: 'DeadAirPixel', 'Courier New', monospace;
      }
      #game {
        display: block;
        position: fixed;
        inset: 0;
        cursor: none;
        image-rendering: pixelated;
      }
      #loading {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        max-width: 177.78vh;
        margin: auto;
        image-rendering: pixelated;
        z-index: 5;
      }
      #menus {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 2px, transparent 2px 4px), rgba(6, 2, 1, 0.72);
      }
      #menus[class^='page-'] {
        display: flex;
      }
      /* The owner's art pack: title backdrop and end-of-run cards behind the menus. */
      #menus.page-title {
        background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 3, 1, 0.55)), url(assets/art/screens/title.jpg) center / cover, #120806;
      }
      #menus.page-summary {
        align-items: flex-start;
        padding-top: 2vh;
      }
      #menus.page-summary.won {
        background: linear-gradient(rgba(10, 4, 2, 0.15), rgba(10, 4, 2, 0.55)), url(assets/art/screens/win.jpg) center / cover, #120806;
      }
      /* Game over: the trapdoor scene (cover-fitted, 3:2 art), the glove waving, GAME OVER, the card. */
      #menus.page-summary.lost {
        background: #0a0503;
        overflow: hidden;
        padding-top: 25vh;
      }
      #menus .gostage {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: max(100vw, 150vh);
        aspect-ratio: 3 / 2;
        background: url(assets/art/gameover/background.jpg) center / 100% 100% no-repeat;
        animation: gostage-in 0.8s ease-out both;
      }
      @keyframes gostage-in {
        from {
          filter: brightness(0);
        }
      }
      /* The glove (4 drawings, there and back) over the trapdoor: GAMEOVER_WAVE_BOX in % of 1536×1024. */
      #menus .gostage .gowave {
        position: absolute;
        left: 44.792%;
        top: 69.922%;
        width: 14.193%;
        height: 18.945%;
        background: url(assets/art/gameover/wave.jpg) 0 0 / 400% 100% no-repeat;
        animation: gowave 0.84s steps(1) infinite;
      }
      @keyframes gowave {
        0% {
          background-position-x: 0%;
        }
        16.66% {
          background-position-x: 33.333%;
        }
        33.33% {
          background-position-x: 66.667%;
        }
        50% {
          background-position-x: 100%;
        }
        66.66% {
          background-position-x: 66.667%;
        }
        83.33% {
          background-position-x: 33.333%;
        }
      }
      /* The lamp flickers: the whole scene dims with it (multiply), and its halo drops out in step. */
      #menus .gostage .golight,
      #menus .gostage .golight::after {
        position: absolute;
        inset: 0;
      }
      #menus .gostage .golight {
        background: #000;
        mix-blend-mode: multiply;
        opacity: 0;
        animation: golight-dim 4.7s steps(1) infinite;
      }
      #menus .gostage .golight::after {
        content: '';
        background: radial-gradient(ellipse 14% 12% at 50.2% 9%, rgba(255, 214, 150, 0.45), transparent 70%);
        mix-blend-mode: screen;
        animation: golight-halo 4.7s steps(1) infinite;
      }
      #menus.reduced-flashing .gostage .golight,
      #menus.reduced-flashing .gostage .golight::after {
        animation: none;
      }
      @keyframes golight-dim {
        0% { opacity: 0; }
        11% { opacity: 0.28; }
        12.5% { opacity: 0.05; }
        13.5% { opacity: 0.35; }
        15% { opacity: 0; }
        46% { opacity: 0.18; }
        47% { opacity: 0; }
        78% { opacity: 0.42; }
        79.5% { opacity: 0.12; }
        81% { opacity: 0.3; }
        82.5% { opacity: 0; }
      }
      @keyframes golight-halo {
        0% { opacity: 1; }
        11% { opacity: 0.3; }
        12.5% { opacity: 0.9; }
        13.5% { opacity: 0.2; }
        15% { opacity: 1; }
        46% { opacity: 0.5; }
        47% { opacity: 1; }
        78% { opacity: 0.1; }
        79.5% { opacity: 0.7; }
        81% { opacity: 0.25; }
        82.5% { opacity: 1; }
      }
      /* A click skips the intro: GAME OVER and the card are there at once. */
      #menus.goskip .gotitle,
      #menus.goskip .gotitle-wrap,
      #menus.goskip.page-summary.lost .panel {
        animation-delay: 0s !important;
        animation-duration: 0.01s !important;
      }
      /* GAME OVER: drops in after the wave (1.9 s), squashes on landing, then rises to make room. */
      #menus .gotitle-wrap {
        position: absolute;
        left: 0;
        right: 0;
        top: 30vh;
        display: flex;
        justify-content: center;
        pointer-events: none;
        animation: gotitle-up 0.55s cubic-bezier(0.5, 0, 0.3, 1) 3s both;
      }
      @keyframes gotitle-up {
        to {
          transform: translateY(-24vh) scale(0.62);
        }
      }
      #menus .gotitle {
        position: relative;
        font-family: 'DeadAirDisplay', 'Georgia', serif;
        font-size: min(13vw, 22vh);
        line-height: 1;
        letter-spacing: 0.02em;
        transform-origin: 50% 100%;
        animation:
          gotitle-in 0.6s cubic-bezier(0.25, 1.5, 0.45, 1) 1.9s both,
          gotitle-wobble 2.6s ease-in-out 3.6s infinite;
      }
      #menus .gotitle span {
        display: block;
        white-space: nowrap;
        paint-order: stroke fill;
      }
      #menus .gotitle .back {
        color: #1a0a04;
        -webkit-text-stroke: 0.15em #1a0a04;
        text-shadow:
          0.05em 0.05em 0 #c8452c,
          0.09em 0.09em 0 #1a0a04;
      }
      #menus .gotitle .front {
        position: absolute;
        inset: 0;
        color: #fbe3c2;
        -webkit-text-stroke: 0.04em #e0a62a;
      }
      @keyframes gotitle-in {
        0% {
          opacity: 0;
          transform: translateY(-60vh) rotate(-6deg) scale(1.1, 0.9);
        }
        60% {
          opacity: 1;
          transform: translateY(0) rotate(1deg) scale(1.15, 0.8);
        }
        80% {
          transform: translateY(-2vh) rotate(-0.5deg) scale(0.95, 1.06);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes gotitle-wobble {
        50% {
          transform: rotate(-1.2deg) translateY(-0.6vh);
        }
      }
      /* The run's card rises once GAME OVER has made room; hidden (unclickable) until then. */
      #menus.page-summary.lost .panel {
        position: relative;
        max-height: 46vh;
        animation: gocard-in 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) 3.1s both;
      }
      @keyframes gocard-in {
        from {
          opacity: 0;
          visibility: hidden;
          transform: translateY(8vh) scale(0.94);
        }
        to {
          opacity: 1;
          visibility: visible;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #menus .gostage .golight,
        #menus .gostage .golight::after {
          animation: none;
        }
        #menus .gotitle,
        #menus .gotitle-wrap,
        #menus.page-summary.lost .panel {
          animation-duration: 0.01s;
        }
      }
      /* Paper panels from the panel kit: decoration in the corners, a plain middle that stretches. */
      #menus .panel {
        color: #2a160a;
        background: none;
        border: 30px solid transparent;
        border-image: url(assets/art/panel/panelBig.png) 60 fill / 30px / 0 stretch;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.75));
        padding: 4px 14px;
        min-width: 340px;
        max-width: 560px;
        max-height: 84vh;
        overflow: auto;
        scrollbar-color: #8a5a28 transparent;
      }
      #menus .panel.wide {
        max-width: 960px;
        width: 90vw;
      }
      #menus .panel.title {
        border: none;
        border-image: none;
        filter: none;
        background: none;
        max-width: 640px;
        overflow: visible;
        max-height: none;
      }
      #menus h2 {
        margin: 0 0 12px;
        color: #f8ead0;
        letter-spacing: 2px;
        font-size: 20px;
        text-align: center;
        padding: 10px 40px 18px;
        background: url(assets/art/panel/ribbonBig.png) center / 100% 100% no-repeat;
        text-shadow: 2px 2px 0 #5a0c06;
      }
      #menus h2.win {
        color: #fff4b0;
      }
      #menus h2.lose {
        color: #ffd8c8;
      }
      #menus h3 {
        color: #a82418;
        font-size: 14px;
        margin: 16px 0 6px;
      }
      #menus p {
        color: #3a2412;
      }
      #menus .logo {
        font-size: 56px;
        color: #ff4a2a;
        text-shadow: 4px 4px 0 #3a0800;
        letter-spacing: 6px;
        text-align: center;
      }
      #menus .logo img {
        width: min(560px, 80vw);
        filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.7));
        animation: bob 3s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-6px) rotate(-0.6deg);
        }
      }
      #menus .logo span {
        color: #ffd040;
        margin-left: 18px;
      }
      #menus .tag {
        text-align: center;
        color: #5a1a0c;
        text-shadow: 1px 1px 0 #fff4d8;
        margin: -6px 0 14px;
        font-size: 12px;
      }
      #menus .title .col {
        width: 320px;
        margin: 0 auto;
      }
      #menus .col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #menus .row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        justify-content: center;
      }
      /* Pill buttons: cream at rest, mustard (with its sparkle) when highlighted. */
      #menus button {
        font: inherit;
        font-size: 15px;
        color: #2a160a;
        background: none;
        border: 14px solid transparent;
        border-image: url(assets/art/panel/pillCream.png) 44 60 fill / 14px 22px / 0 stretch;
        padding: 2px 10px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.08s steps(2);
      }
      #menus button:hover,
      #menus button:focus {
        border-image-source: url(assets/art/panel/pillGold.png);
        color: #3a1404;
        outline: none;
        transform: scale(1.04) rotate(-0.5deg);
      }
      #menus button:active {
        border-image-source: url(assets/art/panel/pillGoldFlat.png);
        transform: scale(0.98, 0.94);
      }
      #menus label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin: 6px 0;
        font-size: 13px;
      }
      #menus label.chk {
        justify-content: flex-start;
      }
      #menus input,
      #menus select {
        font: inherit;
        background: #fff6e0;
        color: #2a160a;
        border: 2px solid #3a2010;
        border-radius: 6px;
        padding: 3px 6px;
      }
      #menus input[type='range'] {
        accent-color: #c0392b;
        background: none;
        border: none;
      }
      #menus input[type='checkbox'] {
        appearance: none;
        width: 22px;
        height: 22px;
        border: none;
        background: url(assets/art/panel/circle.png) center / contain no-repeat;
        cursor: pointer;
      }
      #menus input[type='checkbox']:checked {
        background-image: url(assets/art/panel/check.png);
      }
      #menus input:focus,
      #menus select:focus {
        border-color: #c0392b;
        outline: none;
      }
      #menus .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 18px;
      }
      #menus .small {
        font-size: 11px;
        color: #6a4a2a;
      }
      #menus .foot {
        margin: 16px auto 0;
        font-size: 11px;
        color: #3a2010;
        text-align: center;
        width: max-content;
        padding: 8px 28px;
        border: 12px solid transparent;
        border-image: url(assets/art/panel/plate.png) 40 fill / 12px / 0 stretch;
      }
      #menus table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      #menus td,
      #menus th {
        border-bottom: 1px dashed #b89868;
        padding: 3px 4px;
        text-align: left;
        vertical-align: top;
      }
      #menus tr.tot td {
        color: #a82418;
        font-size: 15px;
      }
      .proproom {
        background: none;
      }
      .props {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      /* Prop Room cards: the deal-card from the panel kit, aged until you've seen the prop. */
      .prop {
        border: 16px solid transparent;
        border-image: url(assets/art/panel/cardCream.png) 40 fill / 16px / 0 stretch;
        padding: 0 2px;
        font-size: 11px;
        min-height: 110px;
        color: #3a2412;
      }
      .prop .icon {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a6a48;
        font-size: 20px;
      }
      .prop .icon img {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      .prop .icon img.unseen {
        filter: brightness(0);
        opacity: 0.28;
      }
      .prop .pn {
        color: #2a160a;
        margin: 4px 0;
      }
      .prop .pt {
        color: #5a4028;
      }
      .prop.locked {
        border-image-source: url(assets/art/panel/cardAged.png);
        opacity: 0.6;
      }
      .prop.r-cursed .pn {
        color: #7a2aa0;
      }
      .prop.r-rare .pn {
        color: #b05a00;
      }
      .prop.r-uncommon .pn {
        color: #1a6a9a;
      }
      .notes .note {
        background: #e0d4b0;
        color: #2a1a0c;
        margin: 4px 0;
        padding: 4px 8px;
        font-family: 'DeadAirTerminal', 'Courier New', monospace;
        font-size: 16px;
      }
      .notes .note .reel {
        color: #ff6040;
        font-size: 0.8em;
        margin-left: 6px;
      }
      .notes .note[open] .reel {
        animation: reel 1s steps(2) infinite;
      }
      @keyframes reel {
        50% {
          opacity: 0.3;
        }
      }
      .notes .note.locked {
        background: #3a2a1a;
        color: #806040;
      }
      .unlocks {
        columns: 2;
        font-size: 11px;
        color: #8a6a48;
      }
      .unlocks li.on {
        color: #2a7a20;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
