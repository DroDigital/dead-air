<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEAD AIR</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        color: #f0e0c0;
        font-family: 'DeadAirPixel', 'Courier New', monospace;
      }
      #game {
        display: block;
        position: fixed;
        inset: 0;
        cursor: none;
        image-rendering: pixelated;
      }
      #loading {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        max-width: 177.78vh;
        margin: auto;
        image-rendering: pixelated;
        z-index: 5;
      }
      #menus {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 2px, transparent 2px 4px), rgba(6, 2, 1, 0.72);
      }
      #menus[class^='page-'] {
        display: flex;
      }
      /* The owner's art pack: title backdrop and end-of-run cards behind the menus. */
      #menus.page-title {
        background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 3, 1, 0.55)), url(assets/art/screens/title.jpg) center / cover, #120806;
      }
      #menus.page-summary {
        align-items: flex-start;
        padding-top: 2vh;
      }
      #menus.page-summary.won {
        background: linear-gradient(rgba(10, 4, 2, 0.15), rgba(10, 4, 2, 0.55)), url(assets/art/screens/win.jpg) center / cover, #120806;
      }
      #menus.page-summary.lost {
        background: linear-gradient(rgba(10, 4, 2, 0.2), rgba(10, 4, 2, 0.6)), url(assets/art/screens/lose.jpg) center / cover, #120806;
      }
      /* Paper panels from the panel kit: decoration in the corners, a plain middle that stretches. */
      #menus .panel {
        color: #2a160a;
        background: none;
        border: 30px solid transparent;
        border-image: url(assets/art/panel/panelBig.png) 60 fill / 30px / 0 stretch;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.75));
        padding: 4px 14px;
        min-width: 340px;
        max-width: 560px;
        max-height: 84vh;
        overflow: auto;
        scrollbar-color: #8a5a28 transparent;
      }
      #menus .panel.wide {
        max-width: 960px;
        width: 90vw;
      }
      #menus .panel.title {
        border: none;
        border-image: none;
        filter: none;
        background: none;
        max-width: 640px;
        overflow: visible;
        max-height: none;
      }
      #menus h2 {
        margin: 0 0 12px;
        color: #f8ead0;
        letter-spacing: 2px;
        font-size: 20px;
        text-align: center;
        padding: 10px 40px 18px;
        background: url(assets/art/panel/ribbonBig.png) center / 100% 100% no-repeat;
        text-shadow: 2px 2px 0 #5a0c06;
      }
      #menus h2.win {
        color: #fff4b0;
      }
      #menus h2.lose {
        color: #ffd8c8;
      }
      #menus h3 {
        color: #a82418;
        font-size: 14px;
        margin: 16px 0 6px;
      }
      #menus p {
        color: #3a2412;
      }
      #menus .logo {
        font-size: 56px;
        color: #ff4a2a;
        text-shadow: 4px 4px 0 #3a0800;
        letter-spacing: 6px;
        text-align: center;
      }
      #menus .logo img {
        width: min(560px, 80vw);
        filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.7));
        animation: bob 3s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-6px) rotate(-0.6deg);
        }
      }
      #menus .logo span {
        color: #ffd040;
        margin-left: 18px;
      }
      #menus .tag {
        text-align: center;
        color: #5a1a0c;
        text-shadow: 1px 1px 0 #fff4d8;
        margin: -6px 0 14px;
        font-size: 12px;
      }
      #menus .title .col {
        width: 320px;
        margin: 0 auto;
      }
      #menus .col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #menus .row {
        display: flex;
        gap: 10px;
        margin-top: 14px;
        justify-content: center;
      }
      /* Pill buttons: cream at rest, mustard (with its sparkle) when highlighted. */
      #menus button {
        font: inherit;
        font-size: 15px;
        color: #2a160a;
        background: none;
        border: 14px solid transparent;
        border-image: url(assets/art/panel/pillCream.png) 44 60 fill / 14px 22px / 0 stretch;
        padding: 2px 10px;
        cursor: pointer;
        text-align: center;
        transition: transform 0.08s steps(2);
      }
      #menus button:hover,
      #menus button:focus {
        border-image-source: url(assets/art/panel/pillGold.png);
        color: #3a1404;
        outline: none;
        transform: scale(1.04) rotate(-0.5deg);
      }
      #menus button:active {
        border-image-source: url(assets/art/panel/pillGoldFlat.png);
        transform: scale(0.98, 0.94);
      }
      #menus label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin: 6px 0;
        font-size: 13px;
      }
      #menus label.chk {
        justify-content: flex-start;
      }
      #menus input,
      #menus select {
        font: inherit;
        background: #fff6e0;
        color: #2a160a;
        border: 2px solid #3a2010;
        border-radius: 6px;
        padding: 3px 6px;
      }
      #menus input[type='range'] {
        accent-color: #c0392b;
        background: none;
        border: none;
      }
      #menus input[type='checkbox'] {
        appearance: none;
        width: 22px;
        height: 22px;
        border: none;
        background: url(assets/art/panel/circle.png) center / contain no-repeat;
        cursor: pointer;
      }
      #menus input[type='checkbox']:checked {
        background-image: url(assets/art/panel/check.png);
      }
      #menus input:focus,
      #menus select:focus {
        border-color: #c0392b;
        outline: none;
      }
      #menus .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 18px;
      }
      #menus .small {
        font-size: 11px;
        color: #6a4a2a;
      }
      #menus .foot {
        margin: 16px auto 0;
        font-size: 11px;
        color: #3a2010;
        text-align: center;
        width: max-content;
        padding: 8px 28px;
        border: 12px solid transparent;
        border-image: url(assets/art/panel/plate.png) 40 fill / 12px / 0 stretch;
      }
      #menus table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      #menus td,
      #menus th {
        border-bottom: 1px dashed #b89868;
        padding: 3px 4px;
        text-align: left;
        vertical-align: top;
      }
      #menus tr.tot td {
        color: #a82418;
        font-size: 15px;
      }
      .proproom {
        background: none;
      }
      .props {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      /* Prop Room cards: the deal-card from the panel kit, aged until you've seen the prop. */
      .prop {
        border: 16px solid transparent;
        border-image: url(assets/art/panel/cardCream.png) 40 fill / 16px / 0 stretch;
        padding: 0 2px;
        font-size: 11px;
        min-height: 110px;
        color: #3a2412;
      }
      .prop .icon {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8a6a48;
        font-size: 20px;
      }
      .prop .icon img {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      .prop .icon img.unseen {
        filter: brightness(0);
        opacity: 0.28;
      }
      .prop .pn {
        color: #2a160a;
        margin: 4px 0;
      }
      .prop .pt {
        color: #5a4028;
      }
      .prop.locked {
        border-image-source: url(assets/art/panel/cardAged.png);
        opacity: 0.6;
      }
      .prop.r-cursed .pn {
        color: #7a2aa0;
      }
      .prop.r-rare .pn {
        color: #b05a00;
      }
      .prop.r-uncommon .pn {
        color: #1a6a9a;
      }
      .notes .note {
        background: #e0d4b0;
        color: #2a1a0c;
        margin: 4px 0;
        padding: 4px 8px;
        font-family: 'DeadAirTerminal', 'Courier New', monospace;
        font-size: 16px;
      }
      .notes .note .reel {
        color: #ff6040;
        font-size: 0.8em;
        margin-left: 6px;
      }
      .notes .note[open] .reel {
        animation: reel 1s steps(2) infinite;
      }
      @keyframes reel {
        50% {
          opacity: 0.3;
        }
      }
      .notes .note.locked {
        background: #3a2a1a;
        color: #806040;
      }
      .unlocks {
        columns: 2;
        font-size: 11px;
        color: #8a6a48;
      }
      .unlocks li.on {
        color: #2a7a20;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
